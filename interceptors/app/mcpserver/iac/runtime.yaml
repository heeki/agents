AWSTemplateFormatVersion: "2010-09-09"
Description: AgentCore Runtime for MCP server

Parameters:
  pRuntimeName:
    Type: String
    Description: Name of the AgentCore Runtime
  pAccountId:
    Type: String
    Description: AWS account ID
  pRegion:
    Type: String
    Description: AWS region
  pS3Bucket:
    Type: String
    Description: S3 bucket containing the deployment package
  pS3Prefix:
    Type: String
    Description: S3 key for the deployment package zip
  pIdpIssuer:
    Type: String
    Description: IdP issuer URL for JWT validation (NONE = no JWT auth)
    Default: "NONE"
  pIdpAudience:
    Type: String
    Description: JWT audience value for token validation (NONE = no audience restriction)
    Default: "NONE"
  pIdpM2MClientId:
    Type: String
    Description: IdP M2M app client ID for AllowedClients JWT validation (NONE to skip)
    Default: "NONE"
  pIdpScopes:
    Type: String
    Description: Space-separated JWT scopes required for access (NONE = no scope restriction)
    Default: "NONE"
  pIdpUserClientId:
    Type: String
    Description: IdP user client ID for USER_PASSWORD_AUTH (NONE to skip)
    Default: "NONE"
  pDelegatedApiEndpoint:
    Type: String
    Description: Delegated API endpoint URL (NONE to disable)
    Default: "NONE"
  pCredentialProviderName:
    Type: String
    Description: OBO credential provider name for delegated API token exchange (NONE to disable)
    Default: "NONE"
  pOboScope:
    Type: String
    Description: OAuth2 scope to request during OBO token exchange (NONE to disable)
    Default: "NONE"

Conditions:
  HasJWTAuth: !Not [!Equals [!Ref pIdpIssuer, "NONE"]]
  HasAudience: !Not [!Equals [!Ref pIdpAudience, "NONE"]]
  HasScopes: !Not [!Equals [!Ref pIdpScopes, "NONE"]]
  HasM2MClientAuth: !Not [!Equals [!Ref pIdpM2MClientId, "NONE"]]
  HasUserClientAuth: !Not [!Equals [!Ref pIdpUserClientId, "NONE"]]
  HasAnyClient: !Or
    - !Not [!Equals [!Ref pIdpM2MClientId, "NONE"]]
    - !Not [!Equals [!Ref pIdpUserClientId, "NONE"]]
  HasDelegatedApi: !Not [!Equals [!Ref pDelegatedApiEndpoint, "NONE"]]
  HasCredentialProvider: !Not [!Equals [!Ref pCredentialProviderName, "NONE"]]

Resources:
  RuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${pRuntimeName}-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref pAccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:bedrock-agentcore:${pRegion}:${pAccountId}:*"
      Policies:
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - logs:FilterLogEvents
                  - logs:GetLogEvents
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${pRegion}:${pAccountId}:log-group:/aws/bedrock-agentcore/runtimes/*"
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"
        - PolicyName: TokenVault
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-agentcore:GetWorkloadAccessToken
                  - bedrock-agentcore:GetWorkloadAccessTokenForJWT
                  - bedrock-agentcore:GetWorkloadAccessTokenForUserId
                  - bedrock-agentcore:GetResourceOauth2Token
                Resource:
                  - !Sub "arn:aws:bedrock-agentcore:${pRegion}:${pAccountId}:workload-identity-directory/default"
                  - !Sub "arn:aws:bedrock-agentcore:${pRegion}:${pAccountId}:workload-identity-directory/default/*"
                  - !Sub "arn:aws:bedrock-agentcore:${pRegion}:${pAccountId}:token-vault/default"
                  - !Sub "arn:aws:bedrock-agentcore:${pRegion}:${pAccountId}:token-vault/default/*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:${pRegion}:${pAccountId}:secret:bedrock-agentcore-identity*"

  Runtime:
    Type: AWS::BedrockAgentCore::Runtime
    DependsOn: RuntimeRole
    Properties:
      AgentRuntimeName: !Ref pRuntimeName
      Description: MCP server for interceptors demo
      RoleArn: !GetAtt RuntimeRole.Arn
      AgentRuntimeArtifact:
        CodeConfiguration:
          Code:
            S3:
              Bucket: !Ref pS3Bucket
              Prefix: !Ref pS3Prefix
          Runtime: PYTHON_3_12
          EntryPoint:
            - start.py
      NetworkConfiguration:
        NetworkMode: PUBLIC
      ProtocolConfiguration: MCP
      EnvironmentVariables:
        AGENT_OBSERVABILITY_ENABLED: "true"
        AWS_REGION: !Ref pRegion
        DELEGATED_API_ENDPOINT: !If [HasDelegatedApi, !Ref pDelegatedApiEndpoint, ""]
        CREDENTIAL_PROVIDER_NAME: !If [HasCredentialProvider, !Ref pCredentialProviderName, ""]
        OBO_SCOPE: !If [HasCredentialProvider, !Ref pOboScope, ""]
      RequestHeaderConfiguration:
        RequestHeaderAllowlist:
          - Authorization
          - X-Amzn-Bedrock-AgentCore-Runtime-Custom-Interceptor-Demo
      AuthorizerConfiguration: !If
        - HasJWTAuth
        - CustomJWTAuthorizer:
            DiscoveryUrl: !Sub "${pIdpIssuer}/.well-known/openid-configuration"
            AllowedAudience: !If
              - HasAudience
              - - !Ref pIdpAudience
              - !Ref AWS::NoValue
            AllowedScopes: !If
              - HasScopes
              - !Split [" ", !Ref pIdpScopes]
              - !Ref AWS::NoValue
            AllowedClients: !If
              - HasAnyClient
              - - !If [HasM2MClientAuth, !Ref pIdpM2MClientId, !Ref AWS::NoValue]
                - !If [HasUserClientAuth, !Ref pIdpUserClientId, !Ref AWS::NoValue]
              - !Ref AWS::NoValue
        - !Ref AWS::NoValue

Outputs:
  oRuntimeArn:
    Description: AgentCore Runtime ARN
    Value: !GetAtt Runtime.AgentRuntimeArn
  oRuntimeId:
    Description: AgentCore Runtime ID
    Value: !GetAtt Runtime.AgentRuntimeId
  oRuntimeRoleArn:
    Description: Runtime execution role ARN
    Value: !GetAtt RuntimeRole.Arn

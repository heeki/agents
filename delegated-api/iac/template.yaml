AWSTemplateFormatVersion: '2010-09-09'
Description: Delegated API - Time endpoint with Entra ID OBO token validation
Transform: AWS::Serverless-2016-10-31
Globals:
  Api:
    OpenApiVersion: 3.0.1
  Function:
    MemorySize: !Ref fnMemory
    Runtime: python3.13
    Timeout: !Ref fnTimeout
Parameters:
  apiStage:
    Type: String
  fnMemory:
    Type: Number
  fnTimeout:
    Type: Number
  entraTenantId:
    Type: String
  entraClientId:
    Type: String
  entraIssuer:
    Type: String
  requiredScope:
    Type: String
Resources:
  # APIGW
  Api:
    Type: AWS::Serverless::Api
    Properties:
      AccessLogSetting:
        DestinationArn: !GetAtt ApiLogGroup.Arn
        Format: '{ "requestId":"$context.requestId", "ip": "$context.identity.sourceIp", "requestTime":"$context.requestTime", "httpMethod":"$context.httpMethod","routeKey":"$context.routeKey", "status":"$context.status","protocol":"$context.protocol", "responseLength":"$context.responseLength" }'
      StageName: !Ref apiStage
      DefinitionBody:
        Fn::Transform:
          Name: AWS::Include
          Parameters:
            Location: openapi.yaml
      EndpointConfiguration:
        Type: REGIONAL
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/delegated-api-${Api}"
      RetentionInDays: 7
  # Lambda
  FnRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: cloudwatch-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: 'arn:aws:logs:*:*:log-group:*:*'
  Fn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/fn
      Handler: handler.handler
      Role: !GetAtt FnRole.Arn
      Environment:
        Variables:
          ENTRA_TENANT_ID: !Ref entraTenantId
          ENTRA_CLIENT_ID: !Ref entraClientId
          ENTRA_ISSUER: !Ref entraIssuer
          REQUIRED_SCOPE: !Ref requiredScope
      Events:
        GetTime:
          Type: Api
          Properties:
            Path: /time
            Method: GET
            RestApiId: !Ref Api
  FnLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Fn}"
      RetentionInDays: 7
Outputs:
  outApi:
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${apiStage}"
  outFn:
    Value: !GetAtt Fn.Arn
